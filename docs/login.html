<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вход — Здоровье</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
<form class="login-card card" method="post" action="/login">
  <div class="login-logo">🌿</div>
  <h1>Здоровье</h1>
  <p class="muted">Личная база данных. Введи пароль.</p>
  <p class="error" id="err" hidden>Неверный пароль</p>
  <input type="password" name="password" placeholder="Пароль" autofocus required autocomplete="current-password">
  <button type="submit" class="btn primary wide">Войти</button>
</form>
<script>
  if (location.search.includes('error')) document.getElementById('err').hidden = false;
</script>
</body>
</html>
