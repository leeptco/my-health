<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вход — Здоровье</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
<form class="login-card card" method="post" action="/login">
  <div class="login-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.1-6C9.5 14.5 12 13 13 12"/></svg></div>
  <h1>Здоровье</h1>
  <p class="muted">Личная база данных. Введи пароль.</p>
  <p class="error" id="err" hidden>Неверный пароль</p>
  <input type="password" name="password" placeholder="Пароль" autofocus required autocomplete="current-password">
  <button type="submit" class="btn primary wide">Войти</button>
</form>
<script>
  if (location.search.includes('error')) document.getElementById('err').hidden = false;
</script>
</body>
</html>
