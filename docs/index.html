<!doctype html>
<html lang="ru">
<head>

<body>
<div id="app">

    <a href="#today" data-tab="today"><span class="ico">☀️</span><span>Сегодня</span></a>
    <a href="#diary" data-tab="diary"><span class="ico">📝</span><span>Дневник</span></a>
    <a href="#visits" data-tab="visits"><span class="ico">🩺</span><span>Визиты</span></a>
    <a href="#meds" data-tab="meds"><span class="ico">💊</span><span>Лекарства</span></a>
    <a href="#labs" data-tab="labs" class="desk"><span class="ico">🧪</span><span>Анализы</span></a>
    <a href="#cycle" data-tab="cycle" class="desk"><span class="ico">🌙</span><span>Цикл</span></a>

    <a href="#more" data-tab="more" class="mob"><span class="ico">⋯</span><span>Ещё</span></a>
  </nav>
  <main id="view"><div class="loading">Загрузка…</div></main>
</div>

<div id="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="icon-btn" data-close aria-label="Закрыть">✕</button>
    </div>
    <form id="sheet-form" class="sheet-body" autocomplete="off"></form>
    <div class="sheet-foot" id="sheet-foot"></div>
  </div>
</div>

<div id="toast" hidden></div>
<!-- Автономный режим (данные в устройстве). Сервер при отдаче страницы заменяет эту строку на window.HEALTH_SERVER = true -->
<script src="./localapi.js"></script>
