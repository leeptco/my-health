<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Здоровье</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Здоровье">
<meta name="theme-color" content="#f6f4ef">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<!-- Контурные иконки навигации (один набор, используется через <use>) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
  <symbol id="i-steth" viewBox="0 0 24 24"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></symbol>
  <symbol id="i-pill" viewBox="0 0 24 24"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M10 2v7.5a2 2 0 0 1-.2.9l-5.1 10.2a1 1 0 0 0 .9 1.4h12.8a1 1 0 0 0 .9-1.4L14.2 10.4a2 2 0 0 1-.2-.9V2"/><path d="M8.5 2h7"/><path d="M7 16.5h10"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-thermo" viewBox="0 0 24 24"><path d="M14 4v10.5a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></symbol>
  <symbol id="i-ruble" viewBox="0 0 24 24"><path d="M8 21V3h6a4.5 4.5 0 0 1 0 9H5"/><path d="M5 16h9"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
</svg>
<div id="app">
  <nav id="nav" aria-label="Разделы">
    <div class="nav-brand">Здоровье</div>
    <a href="#today" data-tab="today"><span class="ico"><svg><use href="#i-sun"/></svg></span><span>Сегодня</span></a>
    <a href="#diary" data-tab="diary"><span class="ico"><svg><use href="#i-pen"/></svg></span><span>Дневник</span></a>
    <a href="#visits" data-tab="visits"><span class="ico"><svg><use href="#i-steth"/></svg></span><span>Визиты</span></a>
    <a href="#meds" data-tab="meds"><span class="ico"><svg><use href="#i-pill"/></svg></span><span>Лекарства</span></a>
    <a href="#labs" data-tab="labs" class="desk"><span class="ico"><svg><use href="#i-flask"/></svg></span><span>Анализы</span></a>
    <a href="#cycle" data-tab="cycle" class="desk"><span class="ico"><svg><use href="#i-moon"/></svg></span><span>Цикл</span></a>
    <a href="#episodes" data-tab="episodes" class="desk"><span class="ico"><svg><use href="#i-thermo"/></svg></span><span>Болезни</span></a>
    <a href="#expenses" data-tab="expenses" class="desk"><span class="ico"><svg><use href="#i-ruble"/></svg></span><span>Расходы</span></a>
    <a href="#refs" data-tab="refs" class="desk"><span class="ico"><svg><use href="#i-book"/></svg></span><span>Справочники</span></a>
    <a href="#export" data-tab="export" class="desk"><span class="ico"><svg><use href="#i-download"/></svg></span><span>Экспорт</span></a>
    <a href="#more" data-tab="more" class="mob"><span class="ico"><svg><use href="#i-more"/></svg></span><span>Ещё</span></a>
  </nav>
  <main id="view"><div class="loading">Загрузка…</div></main>
</div>

<div id="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="icon-btn" data-close aria-label="Закрыть">✕</button>
    </div>
    <form id="sheet-form" class="sheet-body" autocomplete="off"></form>
    <div class="sheet-foot" id="sheet-foot"></div>
  </div>
</div>

<div id="toast" hidden></div>
<!-- Автономный режим (данные в устройстве). Сервер при отдаче страницы заменяет эту строку на window.HEALTH_SERVER = true -->
<script src="./localapi.js"></script>
<script src="./app.js"></script>
</body>
</html>
